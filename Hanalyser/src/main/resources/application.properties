spring.config.import=optional:application-secret.properties

#  Server
server.port=8080
server.servlet.context-path=/

#  Database
spring.datasource.url=jdbc:mysql://localhost:3306/arthatrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#  Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata

#  JWT
hanalyser.jwt.secret=${JWT_SECRET}
hanalyser.jwt.expiration=86400000

#  Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_ID}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OTP
hanalyser.otp.expiry=5


#  Yahoo Finance (no key needed public endpoints)
hanalyser.yahoo.quote-url=https://query1.finance.yahoo.com/v7/finance/quote?symbols=
hanalyser.yahoo.summary-url=https://query2.finance.yahoo.com/v10/finance/quoteSummary/

# Logging
logging.level.com.hanalyser=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level [%15.15thread] %-40.40logger{39} : %msg%n

