<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanalyser - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="noise"></div>

    <div class="auth-wrapper">
        <div class="brand-panel">
            <div class="brand-inner">
                <div class="logo-mark">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <polygon points="24,4 44,38 4,38" fill="none" stroke="#ffffff" stroke-width="2"/>
                        <polygon points="24,12 38,36 10,36" fill="#ffffff" opacity="0.12"/>
                        <line x1="24" y1="4" x2="24" y2="38" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
                        <circle cx="24" cy="24" r="3" fill="#ffffff"/>
                    </svg>
                </div>
                <h1 class="brand-name">HANALYSER</h1>
                <p class="brand-tagline">Intelligent Stock Valuation</p>
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-val">DCF</div>
                        <div class="stat-lbl">Intrinsic Value</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-val">Graham</div>
                        <div class="stat-lbl">Fair Value</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-val">MOS</div>
                        <div class="stat-lbl">Margin of Safety</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-panel">
            <div class="form-container">
                <h2 class="form-title">Create Account</h2>
                <p class="form-subtitle">Start your valuation journey today</p>

                <div id="errorAlert" class="alert alert-error" style="display:none"></div>
                <div id="successAlert" class="alert alert-success" style="display:none"></div>

                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="name" class="form-input" placeholder="Arjun Subramanian" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="input-with-icon">
                            <input type="password" id="password" class="form-input" placeholder="Min 6 characters" required minlength="6">
                            <button type="button" class="eye-toggle" onclick="togglePassword()">👁</button>
                        </div>
                        <div class="password-strength" id="strengthBar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <div class="strength-label" id="strengthLabel"></div>
                    </div>
                    <button type="submit" class="btn-primary" id="registerBtn">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-loader" style="display:none">⏳</span>
                    </button>
                </form>

                <!-- OTP Verification -->
                <form id="otpForm" class="auth-form" style="display:none">
                    <div class="otp-header">
                        <div class="otp-icon">📬</div>
                        <h3>Check Your Inbox</h3>
                        <p>OTP sent to <strong id="otpEmail"></strong></p>
                    </div>
                    <div class="otp-inputs">
                        <input type="text" maxlength="1" class="otp-box" data-index="0">
                        <input type="text" maxlength="1" class="otp-box" data-index="1">
                        <input type="text" maxlength="1" class="otp-box" data-index="2">
                        <input type="text" maxlength="1" class="otp-box" data-index="3">
                        <input type="text" maxlength="1" class="otp-box" data-index="4">
                        <input type="text" maxlength="1" class="otp-box" data-index="5">
                    </div>
                    <button type="submit" class="btn-primary">Verify & Activate</button>
                    <button type="button" class="btn-ghost" onclick="resendOtp()">Resend OTP</button>
                </form>

                <div class="form-footer">
                    Already have an account? <a href="/login.html" class="link">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        let pendingEmail = '';

        document.getElementById('password').addEventListener('input', function() {
            const val = this.value;
            const fill = document.getElementById('strengthFill');
            const label = document.getElementById('strengthLabel');
            let strength = 0;
            if (val.length >= 6) strength++;
            if (val.length >= 10) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;
            const pct = (strength / 5) * 100;
            fill.style.width = pct + '%';
            fill.style.background = pct < 40 ? '#777777' : pct < 70 ? '#b8b8b8' : '#ffffff';
            label.textContent = pct < 40 ? 'Weak' : pct < 70 ? 'Fair' : 'Strong';
            label.style.color = fill.style.background;
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            setLoading(true);
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Registration failed');
                pendingEmail = email;
                document.getElementById('otpEmail').textContent = email;
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('otpForm').style.display = 'block';
                showAlert('success', data.message);
            } catch (err) {
                showAlert('error', err.message);
            } finally {
                setLoading(false);
            }
        });

        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = Array.from(document.querySelectorAll('.otp-box')).map(i => i.value).join('');
            if (otp.length !== 6) { showAlert('error', 'Enter all 6 digits'); return; }
            try {
                const res = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingEmail, otp })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Verification failed');
                showAlert('success', 'Account verified! Redirecting to login...');
                setTimeout(() => window.location.href = '/login.html', 2000);
            } catch (err) {
                showAlert('error', err.message);
            }
        });

        async function resendOtp() {
            try {
                const res = await fetch('/api/auth/resend-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingEmail })
                });
                const data = await res.json();
                showAlert('success', data.message);
            } catch(err) { showAlert('error', 'Failed to resend OTP'); }
        }

        function setLoading(loading) {
            document.querySelector('.btn-text').style.display = loading ? 'none' : 'inline';
            document.querySelector('.btn-loader').style.display = loading ? 'inline' : 'none';
        }
    </script>
</body>
</html>
